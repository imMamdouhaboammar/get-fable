name: Feature request
description: Propose a bounded capability or contract change
title: "[feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the concrete execution gap, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: What observable behavior would prove the request is complete?
    validations:
      required: true
