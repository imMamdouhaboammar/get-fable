documentation:
  - changed-files:
      - any-glob-to-any-file: ['docs/**', '*.md']

dependencies:
  - changed-files:
      - any-glob-to-any-file: ['package.json', 'bun.lock']

github_actions:
  - changed-files:
      - any-glob-to-any-file: ['.github/**']

javascript:
  - changed-files:
      - any-glob-to-any-file: ['src/**', 'test/**']
