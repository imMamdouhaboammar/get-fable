name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Bun ${{ matrix.bun }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bun: 1.3.0
            coverage: false
            inspect_package: false
          - os: ubuntu-latest
            bun: 1.3.14
            coverage: true
            inspect_package: true
          - os: macos-latest
            bun: 1.3.14
            coverage: false
            inspect_package: false

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun }}

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Generated artifact drift
        run: bun run check:generated

      - name: Typecheck
        run: bun run typecheck

      - name: Test without coverage instrumentation
        if: ${{ !matrix.coverage }}
        run: bun test

      - name: Test current runtime with coverage
        if: matrix.coverage
        run: bun test --coverage

      - name: Build
        run: bun run build

      - name: CLI lifecycle smoke test
        shell: bash
        run: |
          bun ./bin/get-fable.js --version
          bun ./bin/get-fable.js help >/dev/null
          bun ./bin/get-fable.js route "review this diff before merge" --json | python3 -m json.tool >/dev/null
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          (
            cd "$tmp"
            bun "$GITHUB_WORKSPACE/bin/get-fable.js" init >/dev/null
            bun "$GITHUB_WORKSPACE/bin/get-fable.js" route "design a modular migration across several files" --apply --json | python3 -m json.tool >/dev/null
            bun "$GITHUB_WORKSPACE/bin/get-fable.js" state executing --json | python3 -m json.tool >/dev/null
            bun "$GITHUB_WORKSPACE/bin/get-fable.js" mutation "ci-smoke" --json | python3 -m json.tool >/dev/null
            bun "$GITHUB_WORKSPACE/bin/get-fable.js" state verifying --json | python3 -m json.tool >/dev/null
            bun "$GITHUB_WORKSPACE/bin/get-fable.js" evidence pass test "bun test" "smoke lifecycle passed" --json | python3 -m json.tool >/dev/null
            bun "$GITHUB_WORKSPACE/bin/get-fable.js" state complete --json | python3 -m json.tool >/dev/null
            bun "$GITHUB_WORKSPACE/bin/get-fable.js" doctor --json | python3 -m json.tool >/dev/null
          )

      - name: Inspect package contents
        if: matrix.inspect_package
        run: npm pack --dry-run --ignore-scripts --json > package-dry-run.json
