# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support documentation.

name: ESLint

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: '30 8 * * 6'

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect ESLint configuration
        id: eslint-config
        shell: bash
        run: |
          if [[ -f .eslintrc.js ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ESLint starter workflow because .eslintrc.js is not configured in this repository."
          fi

      - name: Install ESLint
        if: steps.eslint-config.outputs.present == 'true'
        run: |
          npm install eslint@8.10.0
          npm install @microsoft/eslint-formatter-sarif@3.1.0

      - name: Run ESLint
        if: steps.eslint-config.outputs.present == 'true'
        env:
          SARIF_ESLINT_IGNORE_SUPPRESSED: "true"
        run: >-
          npx eslint .
          --config .eslintrc.js
          --ext .js,.jsx,.ts,.tsx
          --format @microsoft/eslint-formatter-sarif
          --output-file eslint-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        if: ${{ always() && steps.eslint-config.outputs.present == 'true' && hashFiles('eslint-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true
