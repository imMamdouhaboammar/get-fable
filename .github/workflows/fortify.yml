name: Fortify AST Scan

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    - cron: '33 13 * * 2'
  workflow_dispatch:

jobs:
  Fortify-AST-Scan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      FOD_URL: https://ams.fortify.com
      FOD_TENANT: ${{ secrets.FOD_TENANT }}
      FOD_USER: ${{ secrets.FOD_USER }}
      FOD_PASSWORD: ${{ secrets.FOD_PAT }}
      FOD_CLIENT_ID: ${{ secrets.FOD_CLIENT_ID }}
      FOD_CLIENT_SECRET: ${{ secrets.FOD_CLIENT_SECRET }}
      SSC_URL: ${{ vars.SSC_URL }}
      SSC_TOKEN: ${{ secrets.SSC_TOKEN }}
      SC_SAST_TOKEN: ${{ secrets.SC_CLIENT_AUTH_TOKEN }}
      DEBRICKED_TOKEN: ${{ secrets.DEBRICKED_TOKEN }}
      SC_SAST_SENSOR_VERSION: 24.4.0
    steps:
      - name: Check Out Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect Fortify configuration
        id: fortify-config
        shell: bash
        run: |
          enabled=false
          if [[ -n "$FOD_TENANT" && -n "$FOD_USER" && -n "$FOD_PASSWORD" ]]; then
            enabled=true
          elif [[ -n "$FOD_CLIENT_ID" && -n "$FOD_CLIENT_SECRET" ]]; then
            enabled=true
          elif [[ -n "$SSC_URL" && -n "$SSC_TOKEN" && -n "$SC_SAST_TOKEN" ]]; then
            enabled=true
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          if [[ "$enabled" != "true" ]]; then
            echo "Skipping Fortify scan because no complete Fortify credential set is configured."
          fi

      - name: Run Fortify Scan
        if: steps.fortify-config.outputs.enabled == 'true'
        uses: fortify/github-action@ef5539bf4bd9c45c0bd971978f635a69eae55297 # v1.7.0
        with:
          sast-scan: true
          debricked-sca-scan: ${{ env.DEBRICKED_TOKEN != '' }}
