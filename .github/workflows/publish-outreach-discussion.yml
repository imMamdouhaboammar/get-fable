name: Publish outreach discussion

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  discussions: write

concurrency:
  group: get-fable-outreach-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'imMamdouhaboammar/get-fable' && github.event.issue.user.login == 'imMamdouhaboammar'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Publish trusted outreach Discussion
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun scripts/publish-outreach-discussion.ts
