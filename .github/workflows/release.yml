name: Publish npm package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Verify repository and package
        run: |
          bun run check
          npm pack --dry-run --ignore-scripts --json > package-dry-run.json

      - name: Setup Node for npm Trusted Publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Use a Trusted Publishing capable npm CLI
        run: npm install --global npm@11.19.0

      - name: Verify release tag matches package version
        run: node -e "const p=require('./package.json'); const tag=process.env.TAG; if(tag !== 'v'+p.version) throw new Error('release tag '+tag+' does not match package version v'+p.version)"
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Publish with OIDC Trusted Publishing
        run: npm publish --access public
