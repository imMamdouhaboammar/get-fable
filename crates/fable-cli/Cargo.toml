[package]
name = "fable-cli"
version = "1.12.0"
edition = "2021"
authors = ["Mamdouh Abo Ammar"]
description = "High-performance native CLI binary for get-fable"
license = "MIT"

[[bin]]
name = "get-fable-native"
path = "src/main.rs"

[dependencies]
fable-core = { path = "../fable-core" }
fable-eco = { path = "../fable-eco" }
fable-toon = { path = "../fable-toon" }
fable-jev = { path = "../fable-jev" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
chrono = { version = "0.4" }
regex = "1.10"

