[package]
name = "fable-cli"
version = "1.9.0"
edition = "2021"
authors = ["Mamdouh Abo Ammar"]
description = "High-performance native CLI binary for get-fable"
license = "MIT"

[[bin]]
name = "get-fable-native"
path = "src/main.rs"

[dependencies]
fable-core = { path = "../fable-core" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
chrono = { version = "0.4" }
