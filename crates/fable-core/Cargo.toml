[package]
name = "fable-core"
version = "1.9.0"
edition = "2021"
authors = ["Mamdouh Abo Ammar"]
description = "Core deterministic coding lifecycle engine for get-fable"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
fs2 = "0.4"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
