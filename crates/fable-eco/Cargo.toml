[package]
name = "fable-eco"
version = "1.9.0"
edition = "2021"
authors = ["Mamdouh Abo Ammar"]
description = "Curated capability distribution and execution-control subsystem for get-fable"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
semver = { version = "1.0", features = ["serde"] }
sha2 = "0.10"
fs2 = "0.4"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
tempfile = "3.10"
serde_yaml = "0.9"
fable-core = { path = "../fable-core" }
