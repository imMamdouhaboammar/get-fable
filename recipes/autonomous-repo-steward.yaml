name: autonomous-repo-steward
version: 1.0.0
description: Perpetual autonomous repository stewardship loop covering GitHub CI repair, PR reviews, issue triage via TDD, anti-slop audits, and feature packaging.
targetShape: maintenance
steps:
  - skill: fable-discover
    gate: load-bearing-unknowns-resolved
    description: Probe GitHub events, active branches, PRs, and workspace modifications
  - skill: fable-tend
    gate: minimal-diff
    description: Diagnose and repair failing CI runs or merge conflicts
  - skill: fable-review
    gate: grounded-diff-read
    description: Review open PR diffs against anti-slop rules and security invariants
  - skill: fable-plan
    gate: bounded-scope
    description: Decompose triaged issues or roadmap items into atomic LEDGER cards
  - skill: fable-tdd
    gate: red-observed
    description: Author reproducible failing test fixtures before applying fixes
  - skill: fable-execute
    gate: invariants-preserved
    description: Apply surgical, native implementation matching codebase idioms
  - skill: fable-anti-slop-engineering
    gate: machine-checked
    description: Audit diff with Rust engine to block swallowed errors and assertion weakening
  - skill: fable-redteam
    gate: threat-surface-checked
    optional: true
    description: Run penetration probes on modified trust boundaries and endpoints
  - skill: fable-verify
    gate: machine-checked
    description: Execute full Bun test suite and TypeScript typecheck
  - skill: fable-release
    gate: required-checks-pass
    description: Open or update verified Pull Request and record fresh passing evidence
